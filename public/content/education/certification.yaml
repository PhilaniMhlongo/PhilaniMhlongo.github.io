# certification.yaml
# Cloud & platform certifications

certifications:
  - name: AWS Certified CloudOps Engineer – Associate
    provider: AWS
    status: certified
    focus:
      - Cloud operations
      - Monitoring and logging
      - Automation
      - Infrastructure management

  - name: AWS Certified Cloud Practitioner
    provider: AWS
    status: certified
    focus:
      - Cloud fundamentals
      - Core AWS services
      - Billing and pricing
      - Security and compliance

  - name: Certified Kubernetes Administrator (CKA)
    provider: CNCF / Linux Foundation
    status: in_progress
    target: 2026
    focus:
      - Cluster architecture, installation and configuration
      - Workloads and scheduling
      - Services and networking
      - Storage
      - Troubleshooting

career_path:
  current: Platform & DevOps Engineering
  direction:
    - Platform engineering
    - Cloud architecture
    - Site reliability engineering

currently_learning:
  - Kubernetes internals (kubeadm, Cilium, RBAC, NetworkPolicy)
  - Terraform at multi-account scale
  - Evidence-led incident diagnosis

goal: >-
  Build scalable, reliable cloud infrastructure — and leave behind runbooks
  that let anyone else operate it.
